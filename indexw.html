<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TECNO TREBOL | Control Avanzado</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --grad-header: linear-gradient(135deg, #6b21a8 0%, #a855f7 100%);
            --primary: #6b21a8;
            --accent-green: #22c55e;
            --bg: #f3f4f6;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg); margin: 0; padding: 0; color: #1f2937; -webkit-tap-highlight-color: transparent; }
        
        .main-header { background: var(--grad-header); color: white; padding: 50px 20px; text-align: center; border-bottom-left-radius: 40px; border-bottom-right-radius: 40px; box-shadow: var(--card-shadow); }
        .main-header h1 { font-size: 28px; font-weight: 800; margin: 0; }
        
        .content-wrapper { max-width: 1100px; margin: -30px auto 40px; padding: 0 15px; } 
        .glass-card { background: white; border-radius: 24px; padding: 25px; box-shadow: var(--card-shadow); margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.3); }
        
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #111827; border-left: 5px solid var(--primary); padding-left: 15px; }

        /* --- CORRECCIÓN DE ALINEACIÓN DE BORDES --- */
        .input-group, .search-panel { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            width: 100%;
            box-sizing: border-box;
        }

        /* En pantallas grandes se ponen uno al lado del otro */
        @media (min-width: 768px) { 
            .input-group { display: grid; grid-template-columns: 2fr 1fr; } 
            .search-panel { display: grid; grid-template-columns: 1fr 1fr; }
        }

        input { 
            padding: 14px; 
            border-radius: 12px; 
            border: 1px solid #e5e7eb; 
            background: #f9fafb; 
            font-size: 16px; /* 16px evita el zoom automático en iOS */
            width: 100%; 
            box-sizing: border-box; /* Asegura que el borde no estire el input */
            display: block;
        }

        /* Área de tabla deslizable para que no se corte */
        .table-area { overflow-x: auto; margin-top: 20px; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; min-width: 600px; }
        
        .cell-input { border: none; background: transparent; padding: 10px; }
        
        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 15px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; font-size: 14px; }
        .btn-save { background: var(--accent-green); color: white; }
        .btn-add { background: #e5e7eb; color: #374151; }

        .search-panel { background: white; padding: 20px; border-radius: 20px; box-shadow: var(--card-shadow); }

        .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card-item { background: white; border-radius: 20px; padding: 20px; border-left: 10px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .btn-mini { padding: 8px 12px; font-size: 11px; background: #f3f4f6; color: #4b5563; border-radius: 8px; font-weight: 600; cursor: pointer; margin-right: 4px; margin-top: 5px; display: inline-block; }
    </style>
</head>
<body>

    <header class="main-header">
        <h1>TECNO TREBOL</h1>
        <p>Control de Inventario de Órdenes</p>
    </header>

    <div class="content-wrapper">
        <div class="glass-card">
            <div class="section-title" id="formTitle">Nueva Lista</div>
            <div class="input-group">
                <input type="text" id="nombreOrden" placeholder="Nombre de la lista (Proyecto o Proveedor)...">
                <input type="date" id="inputFecha">
            </div>
            <div class="table-area">
                <table>
                    <thead>
                        <tr>
                            <th>Artículo</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th style="width: 70px;">Cant.</th>
                            <th style="width: 100px;">Precio</th>
                            <th style="text-align:right; width: 100px;">Total</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo"></tbody>
                </table>
            </div>
            <div class="btn-row">
                <button class="btn btn-add" onclick="agregarFila()">+ Línea</button>
                <button class="btn btn-save" onclick="guardarRegistro()">Guardar Todo</button>
            </div>
        </div>

        <div class="section-title">Historial Reciente</div>
        <div class="search-panel">
            <input type="text" id="txtBuscar" placeholder="Buscar por nombre..." oninput="filtrar()">
            <input type="date" id="fecBuscar" oninput="filtrar()">
        </div>
        <div id="historialLista" class="history-grid"></div>
    </div>

    <script>
        // --- AQUÍ VA TU LÓGICA DE FIREBASE Y EXPORTAR PDF (SIN CAMBIOS) ---
        // (Asegúrate de copiar las funciones guardarRegistro, filtrar y exportarPDF de tu archivo original)
        
        const firebaseConfig = {
            apiKey: "TU_API_KEY", 
            authDomain: "lista-de-proveedores-ff830.firebaseapp.com",
            projectId: "lista-de-proveedores-ff830",
            storageBucket: "lista-de-proveedores-ff830.appspot.com",
            messagingSenderId: "941421495950",
            appId: "TU_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let registros = [];

        window.onload = () => {
            document.getElementById('inputFecha').value = new Date().toISOString().split('T')[0];
            for(let i=0; i<3; i++) agregarFila();
            cargarDesdeFirebase();
        };

        function cargarDesdeFirebase() {
            db.collection("pedidos").orderBy("creadoEn", "desc").onSnapshot((snapshot) => {
                registros = [];
                snapshot.forEach((doc) => registros.push({ ...doc.data(), fireId: doc.id }));
                filtrar();
            });
        }

        function agregarFila(d = {}) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" class="nombre cell-input" placeholder="Art..." value="${d.n || ''}"></td>
                <td><input type="text" class="marca cell-input" placeholder="Marca..." value="${d.ma || ''}"></td>
                <td><input type="text" class="modelo cell-input" placeholder="Modelo..." value="${d.m || ''}"></td>
                <td><input type="number" class="cant cell-input" oninput="recalc(this)" value="${d.c || ''}"></td>
                <td><input type="number" class="prec cell-input" oninput="recalc(this)" value="${d.p || ''}"></td>
                <td style="text-align:right; font-weight:700; color:#6b21a8;" class="total">${d.t || '$0.00'}</td>
            `;
            document.getElementById('tablaCuerpo').appendChild(tr);
        }

        function recalc(el) {
            const f = el.closest('tr');
            const c = parseFloat(f.querySelector('.cant').value) || 0;
            const p = parseFloat(f.querySelector('.prec').value) || 0;
            f.querySelector('.total').innerText = '$' + (c * p).toFixed(2);
        }

        function filtrar() {
            const nom = document.getElementById('txtBuscar').value.toLowerCase();
            const fec = document.getElementById('fecBuscar').value;
            const filtrados = registros.filter(r => (r.nombreOrden.toLowerCase().includes(nom)) && (fec === "" || r.fecha === fec));
            const lista = document.getElementById('historialLista');
            lista.innerHTML = "";
            filtrados.forEach(reg => {
                const card = document.createElement('div');
                card.className = "card-item";
                card.innerHTML = `<h3>${reg.nombreOrden}</h3><p>📅 ${reg.fecha}</p>
                <div class="card-btns">
                    <span class="btn-mini btn-pdf" onclick="exportarPDF('${reg.fireId}')">PDF</span>
                    <span class="btn-mini" style="color:red" onclick="borrarRegistro('${reg.fireId}')">Borrar</span>
                </div>`;
                lista.appendChild(card);
            });
        }

        // COPIA AQUÍ TU FUNCIÓN exportarPDF ORIGINAL
        function exportarPDF(id) { 
            /* Tu código de PDF original va aquí */ 
            const reg = registros.find(r => r.fireId === id);
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            // ... resto del código del PDF ...
            doc.save(`${reg.nombreOrden}-PEDIDO.pdf`);
        }

        async function guardarRegistro() {
            const nombreOrden = document.getElementById('nombreOrden').value.trim() || "SIN NOMBRE";
            const fecha = document.getElementById('inputFecha').value;
            const filas = document.querySelectorAll('#tablaCuerpo tr');
            let items = [];
            filas.forEach(f => {
                const n = f.querySelector('.nombre').value;
                if(n) items.push({ n, ma: f.querySelector('.marca').value, m: f.querySelector('.modelo').value, c: f.querySelector('.cant').value, p: f.querySelector('.prec').value, t: f.querySelector('.total').innerText });
            });
            await db.collection("pedidos").add({ nombreOrden, fecha, items, creadoEn: firebase.firestore.FieldValue.serverTimestamp() });
            location.reload();
        }
    </script>
</body>
</html>
