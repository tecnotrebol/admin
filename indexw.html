<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TECNO TREBOL | Inventario</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #6b21a8; --grad: linear-gradient(135deg, #6b21a8 0%, #a855f7 100%); }
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; margin: 0; padding: 0; color: #1f2937; }
        
        /* Pantalla de Login */
        #loginOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(10px); }
        .login-box { background: white; padding: 40px 30px; border-radius: 30px; text-align: center; width: 85%; max-width: 350px; }
        .btn-google { background: white; color: #374151; border: 1px solid #d1d5db; padding: 16px; border-radius: 14px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 25px; display: flex; align-items: center; justify-content: center; gap: 12px; }

        /* Header Estilo iPhone */
        .main-header { background: var(--grad); color: white; padding: 60px 20px 80px; text-align: center; border-bottom-left-radius: 40px; border-bottom-right-radius: 40px; position: relative; }
        .btn-logout { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 15px; border-radius: 10px; font-size: 12px; }

        /* Contenido */
        .content { max-width: 600px; margin: -50px auto 40px; padding: 0 20px; display: none; }
        .card { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        
        input { width: 100%; height: 50px; padding: 0 15px; border-radius: 12px; border: 1px solid #e5e7eb; background: #f9fafb; font-size: 16px; box-sizing: border-box; margin-bottom: 12px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .row-input { height: 40px; margin-bottom: 5px; font-size: 14px; }
        
        .btn-add { background: #f3f4f6; color: #374151; border: none; padding: 12px; border-radius: 12px; font-weight: 600; width: 48%; }
        .btn-save { background: #22c55e; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 800; width: 48%; }
        .actions { display: flex; justify-content: space-between; margin-top: 20px; }

        .history-item { background: white; padding: 18px; border-radius: 20px; margin-top: 12px; border-left: 6px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <i class="fas fa-shield-alt" style="font-size: 50px; color: var(--primary);"></i>
            <h2 style="margin: 15px 0 5px;">TECNO TREBOL</h2>
            <p style="color: #6b7280; font-size: 14px;">Acceso exclusivo para personal autorizado.</p>
            <button class="btn-google" onclick="login()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
                Continuar con Google
            </button>
        </div>
    </div>

    <header class="main-header">
        <button class="btn-logout" onclick="logout()">Salir</button>
        <h1 style="margin:0; font-size: 28px; font-weight: 800;">TECNO TREBOL</h1>
    </header>

    <div class="content" id="mainApp">
        <div class="card">
            <h3 style="margin-top:0;">Nueva Orden</h3>
            <input type="text" id="nombreLista" placeholder="Nombre del Proyecto...">
            <input type="date" id="fechaLista">

            <table>
                <thead>
                    <tr style="font-size: 12px; color: #6b7280;">
                        <th>Artículo</th>
                        <th>Marca</th>
                        <th>Cant</th>
                    </tr>
                </thead>
                <tbody id="tablaArticulos"></tbody>
            </table>

            <div class="actions">
                <button class="btn-add" onclick="agregarFila()">+ Línea</button>
                <button class="btn-save" onclick="guardarTodo()">Guardar</button>
            </div>
        </div>

        <div style="margin-top: 30px;">
            <h3>Historial</h3>
            <div id="listaHistorial"></div>
        </div>
    </div>

    <script>
        // Credenciales extraídas de tus capturas
        const firebaseConfig = {
            apiKey: "AIzaSyDuJvzpUAc1oQoOVc8SQ4PErGTIGmiKWn8",
            authDomain: "lista-de-proveedores-ff830.firebaseapp.com",
            projectId: "lista-de-proveedores-ff830",
            storageBucket: "lista-de-proveedores-ff830.firebasestorage.app",
            messagingSenderId: "941421495950",
            appId: "1:941421495950:web:c0b6057de6d1d3e87aabdf"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- SISTEMA DE LOGIN ---
        function login() {
            const provider = new firebase.auth.GoogleAuthProvider();
            // Redirección para evitar bloqueos en iPhone
            auth.signInWithRedirect(provider);
        }

        function logout() { auth.signOut().then(() => location.reload()); }

        // Detectar sesión al cargar
        auth.getRedirectResult().catch(err => alert("Error: " + err.message));

        auth.onAuthStateChanged(user => {
            // Tu correo autorizado
            const autorizado = "trebolpagina@gmail.com"; 
            if (user && user.email.toLowerCase() === autorizado) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                cargarHistorial();
            } else if (user) {
                alert("Usuario no autorizado");
                auth.signOut();
            }
        });

        // --- FUNCIONES DE TABLA ---
        function agregarFila() {
            const tbody = document.getElementById('tablaArticulos');
            const fila = document.createElement('tr');
            fila.innerHTML = `
                <td><input type="text" class="row-input art" placeholder="Artículo"></td>
                <td><input type="text" class="row-input mar" placeholder="Marca"></td>
                <td><input type="number" class="row-input can" style="width:50px"></td>
            `;
            tbody.appendChild(fila);
        }

        async function guardarTodo() {
            const nombre = document.getElementById('nombreLista').value;
            const fecha = document.getElementById('fechaLista').value;
            const filas = document.querySelectorAll('#tablaArticulos tr');
            
            if(!nombre) return alert("Escribe un nombre");

            let items = [];
            filas.forEach(f => {
                const a = f.querySelector('.art').value;
                if(a) items.push({ art: a, mar: f.querySelector('.mar').value, can: f.querySelector('.can').value });
            });

            try {
                await db.collection("pedidos").add({
                    nombre, fecha, items,
                    creado: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("¡Guardado!");
                location.reload();
            } catch (e) { alert("Error al guardar"); }
        }

        function cargarHistorial() {
            db.collection("pedidos").orderBy("creado", "desc").limit(10).onSnapshot(snap => {
                const h = document.getElementById('listaHistorial');
                h.innerHTML = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    h.innerHTML += `<div class="history-item">
                        <div><strong>${d.nombre}</strong><br><small>${d.fecha}</small></div>
                        <i class="fas fa-check-circle" style="color:#22c55e"></i>
                    </div>`;
                });
            });
        }

        window.onload = () => {
            document.getElementById('fechaLista').value = new Date().toISOString().split('T')[0];
            for(let i=0; i<3; i++) agregarFila();
        };
    </script>
</body>
</html>
